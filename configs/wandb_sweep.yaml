method: bayes
metric:
  name: val_accuracy
  goal: maximize
program: experiments/train2.py
command:
  - python
  - experiments/train2.py
  - --epochs
  - ${epochs}
  - --batch-size
  - ${batch_size}
  - --lr
  - ${learning_rate}
  - --optimizer
  - ${optimizer}
  - --name
  - ${experiment_name}
parameters:
  optimizer:
    values: ["sgd", "adam"]
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-1
  l2_lambda:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-1
  batch_size:
    values: [64, 128, 256]
  momentum:
    distribution: uniform
    min: 0.0
    max: 0.99
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  lr_scheduler:
    values: ["none", "step", "cosine"]
  epochs:
    min: 10
    max: 200
  experiment_name:
    value: sweep_run
# notes: |
#   - Sweep assumes your training script calls `wandb.init()` and reads hyperparameters from `wandb.config`.
#   - If your training script uses argparse, either modify it to read `wandb.config` when present, or pass parameters via environment/CLI when launching the agent.
