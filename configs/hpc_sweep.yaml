program: experiments/train_simple.py
method: bayes  # Changed from grid to bayes for smarter search
project: neural-network-numpy
name: HPC_sweep_refined

early_terminate:
  type: hyperband
  min_iter: 5  # Increased from 2 to give runs more time

metric:
  name: val_loss
  goal: minimize

parameters:
  optimizer:
    values: [adam, sgd, momentum]  # Removed rmsprop, focus on top performers
  hidden_layers:
    values:
      - [128, 64]      # Best performer from current runs
      - [256, 128]     # Slightly larger, test if helps
      - [128, 64, 32]  # 3-layer variant
      - [256, 128, 64] # Larger 3-layer
  l2_lambda:
    distribution: uniform
    min: 0.01   # Increased min (was 0.00001) - both runs used 0.018-0.038
    max: 0.05   # Increased max (was 0.01) - run 2 used 0.038
  learning_rate:
    distribution: uniform
    min: 0.001  # Narrowed from 0.0001 - both runs used 0.0048-0.0084
    max: 0.01   # Narrowed from 0.1 - focus on sweet spot
  batch_size:
    distribution: q_log_uniform_values
    q: 16       # Smaller increments (was 64)
    min: 32     # Lowered from 64 - both runs used 40-80
    max: 128    # Lowered from 256 - smaller batches seem better
  activation:
    values: [relu, tanh, elu]  # Removed sigmoid, keep tanh (both runs used it)
  output_activation:
    value: softmax  # Fixed to softmax (both runs used it)
  num_epochs:
    distribution: int_uniform
    min: 150    # Increased min (was 100) - both runs needed 170-194
    max: 200    # Keep max
  weight_init:
    values: [xavier, he]  # Removed random, both runs used xavier/he
  dropout_rate:
    distribution: uniform
    min: 0.1    # Keep min
    max: 0.3    # Lowered max from 0.5 - both runs used 0.064-0.168, focus on lower range
  dataset:
    value: cifar10
  output_size:
    value: 10
  val_split:
    value: 0.2
  random_seed:
    value: 42
  use_wandb:
    value: true

