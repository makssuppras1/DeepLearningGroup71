program: experiments/train_simple.py
method: grid
project: neural-network-numpy
name: HPC_sweep

early_terminate:
  type: hyperband
  min_iter: 2

metric:
  name: val_loss
  goal: minimize

parameters:
  optimizer:
    values: [adam, sgd, momentum, rmsprop]
  hidden_layers:
    values:
      - [128, 64]
      - [256, 128]
      - [512, 256]
      - [128, 64, 32]
      - [256, 128, 64]
  l2_lambda:
    distribution: uniform
    min: 0.00001
    max: 0.01
  learning_rate:
    distribution: uniform
    min: 0.0001
    max: 0.1
  batch_size:
    distribution: q_log_uniform_values
    q: 64
    min: 64
    max: 256
  activation:
    values: [relu, sigmoid, tanh, elu]
  output_activation:
    value: [softmax, sigmoid]
  num_epochs:
    distribution: int_uniform
    min: 100
    max: 200
  weight_init:
    values: [random, xavier, he]
  dropout_rate:
    distribution: uniform
    min: 0.1
    max: 0.5
  dataset:
    value: cifar10
  output_size:
    value: 10
  val_split:
    value: 0.2
  random_seed:
    value: 42
  use_wandb:
    value: true

