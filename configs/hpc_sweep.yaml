program: experiments/train_simple.py
method: bayes  # Bayesian optimization for efficient search
project: neural-network-numpy
name: HPC_sweep_tuned_v2

early_terminate:
  type: hyperband
  min_iter: 10  # Increased to allow runs to develop (best runs need 67-113 epochs)

metric:
  name: val_loss
  goal: minimize

parameters:
  optimizer:
    values: [sgd]
  hidden_layers:
    values:
      - [256]           # Single layer - Run 101: 0.809 val_acc at epoch 113!
      - [128, 64]       # Proven - Run 102: 0.666 val_acc at epoch 86
      - [256, 128]      # Run 103: 0.705 val_acc at epoch 67
      - [512, 256]      # Run 104: 0.654 val_acc at epoch 27 (still improving)
  l2_lambda:
    distribution: uniform
    min: 0.002  # Best runs use 0.0026-0.0042 (much lower than initial 0.01-0.05)
    max: 0.005  # Focused range based on successful runs
  learning_rate:
    distribution: uniform
    min: 0.0025  # Sweet spot - best runs use 0.0026-0.0049
    max: 0.005   # Narrowed from 0.01 based on data
  batch_size:
    distribution: q_log_uniform_values
    q: 8        # Fine-grained increments
    min: 24     # Best runs: 24, 32, 56, 80
    max: 80     # Upper bound from successful runs
  activation:
    values: [tanh]  # Fixed - ALL top runs (0.65-0.81 val_acc) use tanh
  output_activation:
    value: softmax
  num_epochs:
    distribution: int_uniform
    min: 150    # Best runs need 150-194 epochs to converge
    max: 200
  weight_init:
    values: [xavier]  # Fixed - all best runs use xavier initialization
  dropout_rate:
    distribution: uniform
    min: 0.05   # Best runs use 0.059-0.129 (lower than expected)
    max: 0.15   # Focused on lower range that works
  dataset:
    value: cifar10
  output_size:
    value: 10
  val_split:
    value: 0.2
  random_seed:
    value: 42
  use_wandb:
    value: true

