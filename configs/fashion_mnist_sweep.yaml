program: experiments/train_simple.py
method: bayes  # Bayesian optimization for efficient search
project: neural-network-numpy
name: Fashion_MNIST_HPC_sweep

early_terminate:
  type: hyperband
  min_iter: 3  # Allow runs to develop before early stopping

metric:
  name: val_loss
  goal: minimize

parameters:
  optimizer:
    values: [sgd, adam, momentum, rmsprop]  # Test different optimizers
  hidden_layers:
    values:
      - [32, 32, 32]  # Deep three-layer
      - [64, 64, 64]  # Deep three-layer
      - [128, 128, 128]  # Deep three-layer
      - [32, 32, 32, 32]  # Deep three-layer
      - [64, 64, 64, 64]  # Deep three-layer
      - [128, 128, 128, 128]  # Deep three-layer
  l2_lambda:
    distribution: log_uniform
    min: 0.00001  # Very small regularization
    max: 0.001      # Larger regularization
  learning_rate:
    distribution: log_uniform
    min: 0.00001   # Small learning rate
    max: 0.005     # Larger learning rate
  batch_size:
    distribution: q_log_uniform_values
    q: 16        # Fine-grained increments
    min: 16     # Small batches
    max: 64    # Large batches
  activation:
    values: [relu, tanh, sigmoid]  # Test different activations
  output_activation:
    value: softmax
  num_epochs:
    distribution: int_uniform
    min: 100     # Minimum epochs
    max: 150    # Maximum epochs
  weight_init:
    values: [xavier, he, random]  # Test different initializations
  dropout_rate:
    distribution: uniform
    min: 0.0    # No dropout
    max: 0.5    # High dropout
  dataset:
    value: fashion_mnist  # Fixed to Fashion-MNIST
  output_size:
    value: 10
  val_split:
    value: 0.2
  random_seed:
    value: 42
  use_wandb:
    value: true

