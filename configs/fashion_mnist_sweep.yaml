program: experiments/train_simple.py
method: grid  # Bayesian optimization for efficient search
project: neural-network-numpy
name: fashion_mnist_sweep_final

early_terminate:
  type: hyperband
  min_iter: 3  # Allow runs to develop before early stopping

metric:
  name: val_loss
  goal: minimize

parameters:
  optimizer:
    values: [sgd, adam]  # Test different optimizers
  hidden_layers:
    values:
      - [512, 256, 128]
      - [128, 128, 128, 128, 128, 128]
  l2_lambda:
    values: [0.01, 0.0001]    # Larger regularization
  learning_rate:
    values: [0.01, 0.0001] 
  batch_size:
    value: 64
  activation:
    value: relu  # Test different activations
  output_activation:
    value: softmax
  num_epochs:
    value: 100  # Grid search requires discrete values
  weight_init:
    value: he  # Test different initializations
  dropout_rate:
    values: [0.5, 0.2, 0.1] 
  dataset:
    value: fashion_mnist  # Fixed to Fashion-MNIST
  output_size:
    value: 10
  val_split:
    value: 0.2
  random_seed:
    value: 42
  use_wandb:
    value: true
